---
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

permissions: {}

jobs:
  go-latest:
    name: ci/go-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -race -count=1
      - name: Vet
        run: go vet ./...
      - name: Verify generated protocol documents
        run: scripts/check-generated.sh
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --new-from-rev=origin/main

  go:
    name: ci/go
    if: ${{ always() }}
    needs: [go-latest, go-minimum]
    runs-on: ubuntu-latest
    steps:
      - name: Require both compiler checks
        env:
          LATEST_RESULT: ${{ needs.go-latest.result }}
          MINIMUM_RESULT: ${{ needs.go-minimum.result }}
        run: test "$LATEST_RESULT" = success && test "$MINIMUM_RESULT" = success

  go-minimum:
    name: ci/go-minimum
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up minimum supported Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Test minimum supported Go
        run: go test ./... -race -count=1
      - name: Vet minimum supported Go
        run: go vet ./...
      - name: Prepare minimum compiler lint configuration
        run: >-
          awk '{ print; if ($0 == "run:") print "  go: \"1.26.4\"\n  relative-path-mode: wd" }' .golangci.yml
          > "$RUNNER_TEMP/golangci-minimum.yml"
      - name: Lint minimum supported Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          args: --config=${{ runner.temp }}/golangci-minimum.yml --new-from-rev=origin/main

  typescript:
    name: ci/typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Inspect package
        run: npm pack --dry-run

  conformance:
    name: ci/conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build providers and conformance runner
        run: |
          npm --prefix sdk/typescript ci
          npm --prefix sdk/typescript run build
          mkdir -p .tmp/conformance
          go build -trimpath -o .tmp/conformance/mc-conformance ./cmd/mc-conformance
          go build -trimpath -o .tmp/conformance/mc-provider-example ./cmd/mc-provider-example
      - name: Run Go provider conformance
        run: >-
          .tmp/conformance/mc-conformance
          --provider ".tmp/conformance/mc-provider-example"
          --json .tmp/conformance/go.json
          --junit .tmp/conformance/go.xml
      - name: Run TypeScript provider conformance
        run: >-
          .tmp/conformance/mc-conformance
          --provider "node sdk/typescript/dist/examples/provider.js"
          --json .tmp/conformance/typescript.json
          --junit .tmp/conformance/typescript.xml

  release-snapshot:
    name: ci/release-snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.44.0
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.16.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify snapshot contents
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/mission-control-edge_*_linux_*.tar.gz dist/mission-control-edge_*_darwin_*.tar.gz)
          source_archives=(dist/mission-control-edge_*_source.tar.gz)
          sboms=(dist/*.tar.gz.spdx.json)
          [[ ${#archives[@]} -eq 4 ]]
          [[ ${#source_archives[@]} -eq 1 ]]
          [[ ${#sboms[@]} -eq 5 ]]
          [[ -s dist/checksums.txt ]]
          for archive in "${archives[@]}"; do
            listing=$(tar -tzf "$archive")
            grep -Eq '(^|/)mc-schema$' <<<"$listing"
            grep -Eq '(^|/)mc-provider-example$' <<<"$listing"
            grep -Eq '(^|/)mc-conformance$' <<<"$listing"
            grep -Eq '(^|/)LICENSE$' <<<"$listing"
            grep -Eq '(^|/)NOTICE$' <<<"$listing"
          done

  security:
    name: ci/security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/google/go-licenses/v2@v2.0.1
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Check vulnerabilities
        run: govulncheck ./...
      - name: Check dependency licenses
        run: >-
          go-licenses check --include_tests
          --disallowed_types=forbidden,restricted,reciprocal,unknown ./...
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: go
          build-mode: manual
      - name: Build for CodeQL
        run: go build ./...
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:go

  clean-consumer:
    name: ci/clean-consumer
    if: github.event_name == 'push' && github.repository == 'GoCodeAlone/mission-control-edge'
    needs: [go, go-minimum, typescript, conformance, release-snapshot, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Install candidate SDK dependencies
        run: npm --prefix sdk/typescript ci
      - name: Verify clean public consumers
        shell: bash
        run: |
          version=$(node -p 'require("./sdk/typescript/package.json").version')
          scripts/clean-consumer-proof.sh --go-ref "$GITHUB_SHA" \
            --npm-spec ./sdk/typescript --expected-npm-version "$version"
